[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-agent-service"
version = "0.1.0"
description = "Reference implementation of a production WhatsApp AI agent: idempotent webhooks, durable customer memory, tool calling, Hebrew/Arabic output guards, human handoff, evals in CI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "tzdata; sys_platform == \"win32\"",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["agent_service*"]

[tool.setuptools.package-data]
agent_service = ["prompts/*.md", "store/*.sql", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long SQL/strings stay readable
